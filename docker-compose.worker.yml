# Só o PROCESSAMENTO no seu servidor; o site continua na Vercel.
# O site (RUNNER=queue na Vercel) põe o job na fila do banco; este worker pega,
# processa (ffmpeg, IA, render) e grava no mesmo banco e no seu MinIO.
#   1) copie .env.worker.example para .env.worker e preencha
#   2) docker compose -f docker-compose.worker.yml up -d --build
#   3) logs: docker compose -f docker-compose.worker.yml logs -f
services:
  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "worker/daemon.ts"]
    env_file: .env.worker
    environment:
      RUNNER: queue
      STORAGE: s3
      DATA_DIR: /data
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    volumes: ["worker-data:/data"]
volumes:
  worker-data:
